function syncCursor(){const days=item.days||session.days,cx=136+(920-136-18)/Math.max(1,days.length)*(index+.5);$('#cursorline')?.setAttribute('x1',cx);$('#cursorline')?.setAttribute('x2',cx);$('#cursordot')?.setAttribute('cx',cx);const scrub=$('#scrub'),pill=$('#datepill');if(scrub)scrub.value=index;if(pill)pill.textContent=days[index]||'';desks.forEach((d,i)=>{let count=(d.dailyCounts||[]).slice(0,index+1).reduce((a,b)=>a+(+b||0),0),label=$(`#cumulative-${i}`);if(label)label.textContent=`${labelDesk(d,i)} · ${count}`});document.querySelectorAll('.bar').forEach(b=>{let revealed=+b.dataset.day<=index;b.style.opacity=revealed?'0.92':'0.08';b.style.filter=revealed?'none':'grayscale(1)'});let day=days[index],ann=[];for(const ev of events)if(dateKey(ev.date)===day)ann.push(`<span class="pill">◆ ${esc(ev.label)}</span>`);for(let i=0;i<desks.length;i++)for(const a of (desks[i].examples||[]))if(dateKey(a.date||a.published)===day)ann.push(`<a class="pill" href="${esc(a.url||'#')}" target="_blank" rel="noreferrer">▤ ${esc(labelDesk(desks[i],i))}: ${esc(a.headline)}</a>`);const arrival=$('#arrivals');if(arrival)arrival.innerHTML=ann.length?`On this date: ${ann.join(' ')}`:'No selected headline or event marker on this date.'}

function drawDesk(){if(!$('#deskview'))return;let d=desks[activeDesk],v=$('#deskview'),samples=d.examples||[],brief=overviewReplies[d.outletId];v.innerHTML=`<h3 style="margin-top:22px">${esc(labelDesk(d,activeDesk))}: justify your coverage</h3><div class="facts"><div class="fact"><strong>${total(d)}</strong><span>listed pieces / 22 days</span></div><div class="fact"><strong>${d.peakDaily}</strong><span>peak in one day</span></div><div class="fact"><strong>${d.activeDays}</strong><span>dates with coverage</span></div></div><div class="actions"><button class="button" id="overview">${brief?'Replay outlet defence':'Play outlet defence'}</button><button class="secondary" id="readBriefing">Read the defence</button><button class="secondary" id="pauseVoice" ${!audio.currentSrc?'disabled':''}>Pause voice</button></div><p class="small">Role-played editor’s defence. These are game scripts, not statements from the real outlets.</p>${brief?`<article class="briefing"><p class="eyebrow">${esc(brief.title)}</p>${(brief.paragraphs||[]).map(p=>`<div class="briefparagraph"><span class="kind">${{report:'What we covered',analysis:'Our justification',comparison:'The consistency challenge'}[p.kind]||'Our case'}</span><p>${esc(p.text)}</p></div>`).join('')}<details><summary>Check the sources behind this defence</summary>${(item.evidence||session?.evidence||[]).filter(e=>(brief.evidenceIds||[]).includes(e.id)).map(e=>`<p class="small"><a href="${esc(e.url)}" target="_blank" rel="noreferrer">${esc(e.label)}</a> — ${esc(e.text)}</p>`).join('')}</details></article>`:'<p class="notice">Hear what happened, how the coverage built, and the editor’s case for continuing it.</p>'}<details class="source"><summary>Inspect selected headlines (opening a story reveals its outlet)</summary><div class="cards">${samples.map(a=>`<article class="headcard"><time>${esc(a.published)}</time><h3>${esc(a.headline)}</h3><p class="small">${esc(a.verification)}</p><a href="${esc(a.url)}" target="_blank" rel="noreferrer async function hearOverview(d,playAudio=true){stop();if(overviewReplies[d.outletId]){if(playAudio)await speak(overviewReplies[d.outletId],d);else drawDesk();return}const b=$('#overview');b.disabled=true;b.textContent='Preparing the outlet defence…';try{let r;if(live)r=await post('/api/campaign/briefing',{sessionId:session.sessionId,outletId:d.outletId});else{let brief=d.briefing;if(!brief?.paragraphs)throw Error('No script');r={...brief,reply:brief.paragraphs.map(p=>p.text).join('\n\n'),evidenceIds:[...new Set(brief.paragraphs.flatMap(p=>p.evidenceIds))],mode:'reviewed',kind:'briefing'}}overviewReplies[d.outletId]={...r,outletId:d.outletId};if(desks[activeDesk]?.outletId===d.outletId&&$('#deskview')){drawDesk();if(live&&playAudio)await speak(overviewReplies[d.outletId],d)}}catch(e){toast('Outlet defence unavailable; try again.')}finally{const x=$('#overview');if(x)x.disabled=false}}

audio.onplay=()=>{const b=$('#pauseVoice');if(b){b.disabled=false;b.textContent='Pause voice'}};audio.onpause=()=>{const b=$('#pauseVoice');if(b&&audio.currentSrc)b.textContent=audio.ended?'Replay voice':'Resume voice'};stepper(0);welcome();
</script></body></html>
