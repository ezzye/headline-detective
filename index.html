function replay(){const days=item.days||session?.days||[];const max=Math.max(1,...desks.flatMap(d=>d.dailyCounts||[]));const W=920,H=320,left=108,right=18,top=22,bottom=34,laneH=(H-top-bottom)/4,chartW=W-left-right,step=chartW/Math.max(1,days.length);let svg=`<svg class="timeline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Campaign timeline with four anonymous outlet lanes"><defs><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 7.5h8" stroke="#ffffff1a"/></pattern></defs>`;for(let i=0;i<4;i++){let y=top+i*laneH;svg+=`<rect x="${left}" y="${y}" width="${chartW}" height="${laneH}" fill="${i%2?'#111c2c':'#152136'}"/><line class="lane" x1="${left}" y1="${y+laneH}" x2="${W-right}" y2="${y+laneH}"/><text class="laneLabel" id="cumulative-${i}" x="8" y="${y+laneH*.56}">${esc(labelDesk(desks[i],i))} · 0</text>`;let counts=desks[i].dailyCounts||[];counts.forEach((n,j)=>{if(!n)return;let h=Math.max(3,(Number(n)||0)/max*(laneH-17)),x=left+j*step+step*.19,w=Math.max(2,step*.62),yy=y+laneH-5-h;svg+=`<rect class="bar" data-day="${j}" data-desk="${i}" x="${x}" y="${yy}" width="${w}" height="${h}" rx="${Math.min(4,w/2)}" fill="${['#d4f56b','#83d8ff','#ff8773','#c6a0ff'][i]}" opacity=".92"><title>${esc(labelDesk(desks[i],i))}: ${n} listed items on ${esc(days[j])}</title></rect>`;});}for(let j=0;j<days.length;j+=Math.max(1,Math.ceil(days.length/7))){svg+=`<text class="axis" text-anchor="middle" x="${left+j*step+step/2}" y="${H-7}">${esc(days[j]?.slice(5))}</text>`}for(const ev of events){let pos=days.indexOf(ev.date);if(pos>=0){let ex=left+(pos+.5)*step;svg+=`<line x1="${ex}" x2="${ex}" y1="${top}" y2="${H-bottom}" stroke="#f6c768" stroke-width="1" stroke-dasharray="3 5" opacity=".55"/><text x="${ex}" y="${top-6}" text-anchor="middle" fill="#f6c768" font-size="12">${esc(ev.label)}</text>`}}let cx=left+index*step+step/2;svg+=`<line id="cursorline" class="cursorline" x1="${cx}" y1="${top-5}" x2="${cx}" y2="${H-bottom+3}"/><circle id="cursordot" clas <a href="${esc(source.url||'#')}" target="_blank" rel="noreferrer">Open source record</a></p></details></p>`;$('#play').onclick=play;$('#pause').onclick=stop;$('#replay').onclick=()=>{stop();index=0;syncCursor();play()};$('#whole').onclick=()=>{stop();index=days.length-1;syncCursor()};$('#scrub').oninput=e=>{stop();index=+e.target.value;syncCursor()};$('#next').onclick=()=>go(2);syncCursor()}
function syncCursor(){const days=item.days||session.days,cx=108+(920-108-18)/Math.max(1,days.length)*(index+.5);$('#cursorline')?.setAttribute('x1',cx);$('#cursorline')?.setAttribute('x2',cx);$('#cursordot')?.setAttribute('cx',cx);const scrub=$('#scrub'),pill=$('#datepill');if(scrub)scrub.value=index;if(pill)pill.textContent=days[index]||'';desks.forEach((d,i)=>{let count=(d.dailyCounts||[]).slice(0,index+1).reduce((a,b)=>a+(+b||0),0),label=$(`#cumulative-${i}`);if(label)label.textContent=`${labelDesk(d,i)} · ${count}`});document.querySelectorAll('.bar').forEach(b=>{let revealed=+b.dataset.day<=index;b.style.opacity=revealed?'0.92':'0.08';b.style.filter=revealed?'none':'grayscale(1)'});let day=days[index],ann=[];for(const ev of events)if(dateKey(ev.date)===day)ann.push(`<span class="pill">◆ ${esc(ev.label)}</span>`);for(let i=0;i<desks.length;i++)for(const a of (desks[i].examples||[]))if(dateKey(a.date||a.published)===day)ann.push(`<a class="pill" href="${esc(a.url||'#')}" target="_blank" rel="noreferrer">▤ ${esc(labelDesk(desks[i],i))}: ${esc(a.headline)}</a>`);const arrival=$('#arrivals');if(arrival)arrival.innerHTML=ann.length?`On this date: ${ann.join(' ')}`:'No selected headline or event marker on this date.'}

function hear(){app.innerHTML=`<div class="stagehead"><div><p class="eyebrow">02 · Hear the campaign read</p><h2>What do the numbers suggest?</h2><p class="lead">Each analyst looks at the outlet’s full period: amount, pace, timing and possible public value.</p></div><span class="pill">No headline-by-headline verdicts</span></div><div class="grid"><section class="card"><div id="desk-tabs" class="avatars">${desks.map((d,i)=>`<button class="avatar secondary" data-desk="${i}">${avatar(i)} ${esc(labelDesk(d,i))}</button>`).join('')}</div><div id="deskview"></div></section><aside class="card"><p class="eyebrow">Ask the analyst</p><p>One question about this whole campaign. Keep it specific.</p><textarea id="question" maxlength="180" placeholder="What could justify this pace of coverage?" style="width:100%;min-height:100px;background:#101a29;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px"></textarea><p class="small"><span id="qcount">0</span>/180 · <span id="qremaining">3</span> typed questions left</p><button id="ask" class="button">Ask this analyst</button><div id="reply" class="notice" style="margin-top:16px;display:none"></div><button id="listen" class="secondary" style="margin-top:10px;display:none">▶ Listen to reply</button><p class="small">Analyst voices are interpretations, not source records. ${live?'Four distinct analyst voices when configured.':'Offline practice: read the text replies.'}</p></aside></div><div class="actions"><button class="secondary" id="back">← Timeline</button><button class="button" id="next">Judge the campaigns →</button></div>`;activeDesk=0;drawDesk();$('#qremaining').textContent=3-typedQuestionCount;$('#desk-tabs').onclick=e=>{const b=e.target.closest('[data-desk]');if(b){activeDesk=+b.dataset.desk;drawDesk()}};$('#question').oninput=e=>$('#qcount').textContent=e.target.value.length;$('#ask').onclick=ask;$('#listen').onclick=listen;$('#back').onclick=()=>go(1);$('#next').onclick=()=>go(3)}
function drawDesk(){if(!$('#deskview'))return;let d=desks[activeDesk],v=$('#deskview'),samples=d.examples||[],overview=overviewReplies[d.outletId];v.innerHTML=`<h3 style="margin-top:22px">${esc(labelDesk(d,activeDesk))} · ${total(d)} listed pieces</h3><div class="facts"><div class="fact"><strong>${d.activeDays??d.dailyCounts.filter(Boolean).length}</strong><span>active days / 22</span></div><div class="fact"><strong>${d.peakDaily??Math.max(0,...d.dailyCounts)}</strong><span>peak in one day</span></div><div class="fact"><strong>${d.beforeResignationCount??'—'} / ${d.afterResignationCount??'—'}</strong><span>before 5 Aug / from 5 Aug</span></div></div><button class="secondary" id="overview">${overview?'Replay overview':'Hear this campaign'}</button><div class="cards">${overview?`<article class="headcard" style="grid-column:1/-1"><strong>Whole-window analyst overview</strong><p>${esc(overview.reply)}</p><button class="secondary" data-listen-overview>▶ Listen</button></article>`:''}</div><p class="small" style="margin-top:16px">Selected examples from this campaign; the complete catalog is not shown.</p><div class="cards">${samples.slice(0,5).map(a=>`<article class="headcard"><time>${esc(a.published||a.date||'Date not listed')}</time><h3>${esc(a.headline)}</h3><p class="small">${esc(a.verification||'Verification label not supplied')}</p><a href="${esc(a.url||'#')}" target="_blank" rel="noreferrer">Open story (reveals outlet) ↗</a></article>`).join('')||'<p class="small">No headline samples supplied.</p>'}</div>`;$('#overview').onclick=()=>hearOverview(d);v.querySelector('[data-listen-overview]')?.addEventListener('click',()=>speak(overview,d));}
async function hearOverview(d){if(overviewReplies[d.outletId]){await speak(overviewReplies[d.outletId],d);return}const b=$('#overview');b.disabled=true;b.textContent='Preparing campaign overview…';try{let r;if(live)r=await post('/api/campaign/respond',{sessionId:session.sessionId,outletId:d.outletId,question:'Give a brief whole-window overview of this outlet campaign: total volume, pace, documented timing, possible public value and the limits of this record.'});else r={reply:`Practice overview: ${total(d)} listed pieces over ${item.days.length} days, across ${d.activeDays} active days; peak ${d.peakDaily} in one day. Consider the volume alongside timing and public value. A high count alone does not prove motive.`,mode:'offline'};overviewReplies[d.outletId]={...r,outletId:d.outletId};drawDesk();if(live)await speak(overviewReplies[d.outletId],d)}catch(e){toast('Campaign overview unavailable; try again.')}finally{const x=$('#overview');if(x)x.disabled=false}}

function question(){app.innerHTML=`<div class="intro"><p class="eyebrow">03 · The question</p><h1>How much coverage<br>was <em>justified?</em></h1><p class="lead">Judge each outlet’s campaign across all 22 dates. Consider the public value, pace and documented developments. The archive may be incomplete, so keep uncertainty in view.</p><div class="card"><p><strong>Use the whole record.</strong> The daily counts show listed pieces across the window. Samples help you inspect actual headlines. An event marker supplies context, not a causal claim.</p><p class="small">Win with 8/10 evidence points. Your campaign verdicts are personal judgments and have no moral answer key.</p></div><button class="button" id="next">Review all four campaigns →</button></div>`;$('#next').onclick=()=>go(4)}
const kinds=[['justified','Faithful','Volume appears proportionate to public interest.'],['mixed','Mixed','Some coverage seems warranted; the overall balance is uncertain.'],['pile-on','Traitor','Volume or pace appears excessive for the public value shown.'],['unclear','Unclear','The record does not support a confident call.']];
function judge(){let rows=desks.map((d,i)=>{let n=total(d),v=verdicts[d.outletId];return `<article class="card"><div class="deskrow"><div><div class="avatar">${avatar(i)} ${esc(labelDesk(d,i))}</div><p class="small">${n} listed pieces / 22 days · peak ${d.peakDaily??Math.max(0,...d.dailyCounts)}</p><p class="small">${d.beforeResignationCount??'—'} before 5 Aug · ${d.afterResignationCount??'—'} from 5 Aug (resignation date)</p></div><div><label class="small">Your suggested volume<br><input aria-label="Suggested justifiable count for ${esc(labelDesk(d,i))}" type="number" min="0" max="${n*2}" value="${budgets[d.outletId]??''}" placeholder="unknown" class="budget" data-budget="${esc(d.outletId)}"></label></div></div><div class="verdicts">${kinds.map(([key,title,desc])=>`<button class="choice" data-vote="${key}" data-outlet="${esc(d.outletId)}" aria-pressed="${v===key}"><strong>${title}</strong><span class="small">${desc}</span></button>`).join('')}</div></article>`}).join('');app.innerHTML=`<div class="stagehead"><div><p class="eyebrow">04 · Judge campaigns</p><h2>Make one call per desk</h2><p class="small">Faithful / Mixed / Traitor / Unclear describe your view of the whole coverage campaign. Suggested volume is optional.</p></div></div><div class="grid" style="grid-template-columns:1fr 1fr">${rows}</div><section class="card" style="margin-top:18px"><p class="eyebrow">Five evidence checks · 2 points each</p><div class="checks">${checks.map(c=>`<label><span>${esc(c.prompt)}</span><select data-answer="${esc(c.id)}"><option value="">Choose</option>${c.options.map(o=>`<option value="${esc(o.value)}" ${answers[c.id]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`).join('')}<label><span>Your case: explain what was justified and where the balance may shift. 40–600 characters.</span><textarea id="justification" maxlength="600" minlength="40" placeholder="Name the evidence and one limit of the record.">${esc(justification)}</textarea></label></di function CampaignReveal(g,item){let results=(item.reasoningChecks||[]).map(c=>({id:c.id,prompt:c.prompt,correct:g.reasoningAnswers[c.id]===c.answer,answer:c.answer,explanation:c.explanation,evidenceIds:c.evidenceIds}));return {mode:'campaign',roles:g.desks.map(d=>({outletId:d.outletId,outletName:d.outlet,campaign:d,decision:g.verdicts[d.outletId],recommendedCount:g.budgets[d.outletId]})),reasoningScore:results.filter(r=>r.correct).length*2,reasoningTotal:10,reasoningResults:results,justification:g.justification.trim(),source:item.source,period:{start:item.start,end:item.end,endNote:item.endNote},label:'Campaign choices and written reasoning are discussion inputs; points reflect only the five evidence checks.'}}
window.CampaignReveal=CampaignReveal;
async function finish(){let missing=desks.filter(d=>!verdicts[d.outletId]);if(missing.length||checks.some(c=>!answers[c.id])||justification.trim().length<40){toast('Choose all four campaign calls, answer five checks and write at least 40 characters.');return}if(justification.length>600){toast('Keep your case to 600 characters.');return}if(desks.some(d=>budgets[d.outletId]!==null&&(!Number.isInteger(budgets[d.outletId])||budgets[d.outletId]<0||budgets[d.outletId]>total(d)*2))){toast('Suggested volumes must be whole numbers within the shown range.');return}stop();let result;if(live){try{result=await post('/api/campaign/reveal',{sessionId:session.sessionId,campaignVerdicts:verdicts,recommendedCounts:budgets,reasoningAnswers:answers,justification});}catch(e){toast('Reveal unavailable. Your choices are still on this page.');return}}else{result=CampaignReveal({desks,verdicts,budgets,reasoningAnswers:answers,justification},item)}window.lastCampaignResult=result;renderReveal(result)}
function renderReveal(r){stop();stepper(5);let roles=r.roles||[];app.innerHTML=`<div class="stagehead"><div><p class="eyebrow">05 · Reveal the record</p><h2>Your campaign verdicts</h2><p class="lead">Your call is visible beside each campaign’s actual counts and the source limits.</p></div><span class="winner">${r.reasoningScore??0} / ${r.reasoningTotal??10} evidence points · ${(r.reasoningScore??0)>=8?'Jury brief ready':'Review the evidence checks'}</span></div><div class="grid" style="grid-template-columns:1fr 1fr">${roles.map((role,i)=>{let c=role.campaign||{},n=total(c);return `<article class="card resultrow"><div class="deskrow"><h3>${esc(role.outletName||labelDesk(desks[i],i))}</h3><span class="badge">${esc(role.decision)}</span></div><div class="facts"><div class="fact"><strong>${n}</strong><span>listed pieces / 22 days</span></div><div class="fact"><strong>${c.peakDaily??'—'}</strong><span>peak day</span></div><div class="fact"><strong>${c.beforeResignationCount??'—'} / ${c.afterResignationCount??'—'}</strong><span>before 5 Aug / from 5 Aug</span></div></div><p class="small">Your suggested count: ${role.recommendedCount??'unknown'} · Active days: ${c.activeDays??'—'}</p><div class="volume-track" aria-label="Recorded versus suggested volume"><span style="width:100%;background:var(--coral)"></span>${role.recommendedCount===null?'':`<span style="width:${Math.min(100,100*role.recommendedCount/n)}%;background:var(--lime)"></span>`}</div><p class="small">Coral: listed volume · Green: your suggested volume (discussion input)</p><h4>What supports scrutiny</h4><p>${esc(c.reviewNotes?.pressure||'No pressure note supplied.')}</p><h4>What complicates the call</h4><p>${esc(c.reviewNotes?.publicValue||'No public value note supplied.')}</p><p class="small">Limit: ${esc(c.reviewNotes?.limit||'No limit supplied.')}</p></article>`}).join('')}</div><section class="card" style="margin-top:18px"><p class="eyebrow">Your reasoning</p><p>${esc(r.justification)}</p>${(r.reasoningResults||[]).map(x=>`<div class="resultrow"><strong>${x.correct?'✓':'○'} ${esc(x.prompt)}</strong><p class="small">Record answer: ${esc(x.answer)} · ${esc(x.explanation)}</p></div>`).join('')}<p class="notice">Counts describe this archive’s selected records. They can establish volume and timing, but do not by themselves prove motive, fairness or harm.</p><details class="source"><summary>Evidence and source limits</summary><p>${esc(r.source?.scopeNote||source.scopeNote||'')}</p><p>${esc(r.source?.corpusCount||source.corpusCount||'')} items indexed across ${esc(r.source?.outletUniverse||source.outletUniverse||'')} outlets. Window: ${esc(r.period?.start||item.start)} to ${esc(r.period?.end||item.end)}, ${esc(r.period?.endNote||item.endNote||'')}.</p>${(item.evidence||session?.evidence||[]).map(e=>`<p><a href="${esc(e.url||'#')}" target="_blank" rel="noreferrer">${esc(e.label||e.id)}</a> — ${esc(e.text)}</p>`).join('')}</details></section><div class="actions"><button class="secondary" id="again">Review the timeline</button><button class="button" id="saveResult">Save this result</button></div>`;$('#again').onclick=()=>{index=0;go(1)};$('#saveResult').onclick=()=>saveResultHTML(r)}
function saveHTML(){const blob=new Blob(['<!doctype html>\n'+ORIGINAL_HTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='faithful-to-the-facts.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Clean game copy downloaded. Attach that file to share it privately.')}
function saveResultHTML(result){const css=$('style').textContent,summary=`<header><p class="eyebrow">Faithful to the Facts · Saved campaign result</p><h1>${esc(item.title||'Campaign coverage')}</h1><p>${esc(result.period?.start||item.start)} — ${esc(result.period?.end||item.end)} · ${esc(result.period?.endNote||item.endNote||'')}</p><p class="small">A static record of your campaign judgments and evidence-check results. Your answers and personal text are included in this file.</p></header>${app.innerHTML}`;const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign Jury Result</title><style>${css}body{padding:20px}.actions,#again,#saveResult{display:none!important}a{overflow-wrap:anywhere}</style></head><body><main class="shell">${summary}</main></body></html>`;const url=URL.createObjectURL(new Blob([html],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download='faithful-to-the-facts-result.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Static result file downloaded.')}
$('#save').onclick=()=>saveHTML(false);$('#share').onclick=async()=>{try{let blob=new Blob(['<!doctype html>\n'+ORIGINAL_HTML],{type:'text/html'}),file=new File([blob],'faithful-to-the-facts.html',{type:'text/html'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Faithful to the Facts'});else {saveHTML();toast('Attach the downloaded HTML file in your private message.')}}catch{saveHTML();toast('Attach the downloaded HTML file in your private message.')}};$('#motion').onclick=()=>{reduceMotion=!reduceMotion;if(reduceMotion)stop();$('#motion').textContent=`Motion: ${reduceMotion?'reduced':'on'}`;document.documentElement.classList.toggle('reduced-motion',reduceMotion);document.documentElement.style.scrollBehavior=reduceMotion?'auto':''};
stepper(0);welcome();
</script></body></html>
