function welcome(){caseList=JSON.parse($('#campaign-data')?.textContent||'[]');if(!Array.isArray(caseList))caseList=[];const selected=caseList.some(c=>c.id===item?.id)?item.id:(caseList[0]?.id||'');app.innerHTML=`<section class="intro"><p class="eyebrow">A campaign jury · Public-interest reporting</p><h1>Judge the <em>coverage.</em><br>See the whole arc.</h1><p class="lead">Use the same questions for each outlet. Inspect what the record shows, what it leaves open, and whether the amount of attention was justified.</p><label class="small">Choose a case<select id="case-choice" style="display:block;margin-top:7px;min-width:min(90vw,430px);background:#101a29;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px">${caseList.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>${esc(c.title)} · ${esc(c.start)}–${esc(c.end)}</option>`).join('')}</select></label><div class="facts"><div class="fact"><strong>${caseList.length||'—'}</strong><span>cases</span></div><div class="fact"><strong>${criteria.length||6}</strong><span>shared scrutiny criteria</span></div><div class="fact"><strong>1</strong><span>campaign judgment per outlet</span></div></div><p class="small">A scrutiny question is not a finding. Counts are evidence to consider, never proof by themselves.</p><button id="start" class="button" ${caseList.length?'':'disabled'}>Enter the jury →</button><p id="status" class="small">The local game service is checked when you enter. Embedded records support offline practice.</p></section>`;$('#start').onclick=start}

svg+='</svg>';const eventNote=events.map(e=>`<span class="pill">◆ ${esc(e.date)} · ${esc(e.label)}</span>`).join(' ');app.innerHTML=`<div class="stagehead"><div><p class="eyebrow">01 · Timeline</p><h2>${esc(item.title||session?.title||'Campaign coverage')}</h2><p class="small">${esc(item.start)} — ${esc(item.end)} · ${esc(item.endNote||'')}</p></div><span class="pill">${aggregate?'Whole-period aggregate':'Dated listed coverage'}</span></div><div class="grid campaign-grid"><section class="card chartbox"><div class="charttop"><div class="playrow"><button id="play" ${aggregate?'disabled':''}>▶ Play</button><button id="pause" ${aggregate?'disabled':''}>Ⅱ Pause</button><button id="replay" ${aggregate?'disabled':''}>↺ Replay</button></div><span class="pill" id="datepill">${aggregate?'Aggregate window':esc(days[index]||'')}</span></div>${svg}<div class="event-strip small" aria-label="Documented events">${eventNote||'No dated events supplied.'}</div>${aggregate?`<p class="notice">${esc(dataCompleteness||'Aggregate totals only. Daily counts, peaks and before/after split are not available.')}</p>`:`<div class="datecontrol"><input class="range" id="scrub" type="range" min="0" max="${Math.max(0,days.length-1)}" value="${index}" aria-label="Scrub timeline date"><button class="secondary" id="whole">Show whole window</button></div><div id="arrivals" class="small" aria-live="polite"></div>`}</section><aside class="card"><p class="eyebrow">${desks.length} anonymous outlet${desks.length===1?'':'s'}</p><div class="avatars">${desks.map((d,i)=>`<span class="avatar">${avatar(i)} ${esc(labelDesk(d,i))}</span>`).join('')}</div><div class="facts" style="margin-top:16px"><div class="fact"><strong>${esc(available(source.corpusCount))}</strong><span>${esc(source.unit||'items in archive')}</span></div><div class="fact"><strong>${esc(available(source.outletUniverse))}</strong><span>outlets indexed</span></div><div class="fact"><strong>${esc(desks.reduce((n,d)=>n+total(d),0))}</strong><span>listed with these outlets</span></div></div>${splitLabel?`<p class="small">${esc(splitLabel)} · ${esc(splitEventDate||'date unavailable')}</p>`:''}<p class="notice" style="margin-top:14px">${aggregate?'A selected-period total cannot establish daily pace or event splits.':`Missing dates mean no item is listed in this dataset, not proof nothing was published. ${esc([source.scopeNote,dataCompleteness].filter(Boolean).join(' '))}`}</p><div class="actions"><button class="secondary" id="caseBack">Choose another case</button><button class="button" id="next">Inspect coverage →</button></div></aside></div><p class="small source"><details><summary>Source, scope, events and limits</summary><p>${esc(source.scopeNote||'Source scope has not been supplied.')}</p><p>${esc(dataCompleteness||'')}</p><p>${esc(source.unit||'Listed pieces')} · retrieved ${esc(source.retrieved||'date not supplied')} · <a href="${esc(source.url||'#')}" target="_blank" rel="noreferrer">Open source record</a></p><p>${eventNote}</p></details></p>`;$('#next').onclick=()=>go(2);$('#caseBack').onclick=()=>go(0);if(!aggregate){$('#play').onclick=play;$('#pause').onclick=()=>{clearInterval(timer);toast('Timeline paused.')};$('#replay').onclick=()=>{clearInterval(timer);index=0;syncCursor();play()};$('#whole').onclick=()=>{clearInterval(timer);index=days.length-1;syncCursor()};$('#scrub').oninput=e=>{clearInterval(timer);index=+e.target.value;syncCursor()};syncCursor()}}

aining').textContent=3-(typedQuestionCounts[d.outletId]||0);activeCriterionId=null;toast('Reply added to the record.')}catch(e){toast('The outlet could not answer. Try again.')}finally{const b=$('#ask');if(b){b.disabled=false;b.textContent='Ask this outlet'}}}

function renderReveal(r){stop();stepper(5);const roles=r.roles||[];app.innerHTML=`<div class="stagehead"><div><p class="eyebrow">05 · Reveal</p><h2>${esc(r.caseTitle||item.title)} · campaign judgments</h2><p class="lead">Compare each call with the evidence-bound scrutiny matrix and the actual scope of this case.</p></div><span class="winner">${r.reasoningScore??0} / ${r.reasoningTotal??10} facts · ${(r.reasoningScore??0)>=8?'Jury brief ready':'Review the evidence checks'}</span></div><div class="grid campaign-grid">${roles.map((role,i)=>{const c=role.campaign||{},n=total(c);return `<article class="card resultrow"><div class="deskrow"><h3>${esc(role.outletName||labelDesk(desks[i],i))}</h3><span class="badge">${esc(role.decision)}</span></div><div class="facts"><div class="fact"><strong>${n}</strong><span>listed pieces</span></div><div class="fact"><strong>${esc(available(c.peakDaily))}</strong><span>peak day</span></div><div class="fact"><strong>${esc(available(c.beforeResignationCount))} / ${esc(available(c.afterResignationCount))}</strong><span>${esc(splitLabel||'before / after')}</span></div></div><p class="small">Suggested count: ${role.recommendedCount??'unknown'} · Active days: ${esc(available(c.activeDays))}</p><h4>Shared scrutiny matrix</h4>${criteria.map(cr=>{const row=(c.scrutiny||[]).find(x=>x.criterionId===cr.id),rating=r.scrutinyAssessments?.[role.outletId]?.[cr.id]||'unknown';return `<div class="resultrow"><strong>${esc(cr.label)} · ${esc(rating)}</strong><p class="small"><strong>Case observation</strong></p><p>${esc(row?.observation||'No case-specific observation supplied.')}</p><p class="small">Investigative question: ${esc(row?.question||cr.question)} · Limit: ${esc(row?.limit||'No additional limit supplied.')}</p><p class="small">${(row?.evidenceIds||[]).map(evidenceLink).join(' · ')||'No linked evidence supplied.'}</p></div>`}).join('')}<h4>Coverage context</h4><p>${esc(c.reviewNotes?.publicValue||'No public-value note supplied.')}</p><p class="small">Scrutiny concern: ${esc(c.reviewNotes?.pressure||'No concern summary supplied.')} Limit: ${esc(c.reviewNotes?.limit||'No limit supplied.')}</p></article>`}).join('')}</div><section class="card" style="margin-top:18px"><p class="eyebrow">Your reasoning</p><p>${esc(r.justification)}</p>${(r.reasoningResults||[]).map(x=>`<div class="resultrow"><strong>${x.correct?'✓':'○'} ${esc(x.prompt)}</strong><p class="small">Record answer: ${esc(x.answer)} · ${esc(x.explanation)}</p></div>`).join('')}<p class="notice">${r.countMode==='aggregate'?'Aggregate totals do not reveal daily pace, peak days or event splits.':'Counts describe this case’s selected records.'} Volume alone does not prove motive, fairness or harm.</p><details class="source"><summary>Case identity, source and scope</summary><p>${esc(r.caseTitle||item.title)} · ${esc(item.subject||'')}</p><p>${esc(r.source?.scopeNote||source.scopeNote||dataCompleteness||'')}</p><p>${esc(available(r.source?.corpusCount??source.corpusCount))} ${esc(source.unit||'archive items')} · ${esc(available(r.source?.outletUniverse??source.outletUniverse))} indexed outlets. Window: ${esc(r.period?.start||item.start)} to ${esc(r.period?.end||item.end)}, ${esc(r.period?.endNote||item.endNote||'')}.</p>${(item.evidence||session?.evidence||[]).map(e=>`<p><a href="${esc(e.url||'#')}" target="_blank" rel="noreferrer">${esc(e.label||e.id)}</a> — ${esc(e.text)}</p>`).join('')}</details></section><div class="actions"><button class="secondary" id="again">Review timeline</button><button class="button" id="saveResult">Save this result</button></div>`;$('#again').onclick=()=>{index=0;go(1)};$('#saveResult').onclick=()=>saveResultHTML(r)}
function saveHTML(){const blob=new Blob(['<!doctype html>\n'+ORIGINAL_HTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='faithful-to-the-facts.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Clean game file downloaded. Attach it to share privately.')}
function saveResultHTML(r){const css=$('style').textContent,markup=`<header><p class="eyebrow">Faithful to the Facts · saved jury result</p><h1>${esc(item.title)}</h1><p>${esc(item.start)} — ${esc(item.end)} · ${esc(item.endNote||'')}</p><p class="small">Static result copy. It includes campaign calls, matrix ratings and written reasoning.</p></header>${app.innerHTML}`,html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(item.title)} — Jury Result</title><style>${css}body{padding:20px}.actions,#again,#saveResult{display:none!important}a{overflow-wrap:anywhere}</style></head><body><main class="shell">${markup}</main></body></html>`,url=URL.createObjectURL(new Blob([html],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download='campaign-jury-result.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Static result file downloaded.')}
$('#save').onclick=saveHTML;$('#share').onclick=async()=>{try{const file=new File([ORIGINAL_HTML],'faithful-to-the-facts.html',{type:'text/html'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Faithful to the Facts'});else saveHTML()}catch{saveHTML()}};$('#motion').onclick=()=>{reduceMotion=!reduceMotion;if(reduceMotion)clearInterval(timer);$('#motion').textContent=`Motion: ${reduceMotion?'reduced':'on'}`;document.documentElement.classList.toggle('reduced-motion',reduceMotion)};$('#motion').textContent=`Motion: ${reduceMotion?'reduced':'on'}`;audio.onplay=()=>{const b=$('#pause-brief');if(b)b.textContent='Ⅱ Pause voice'};audio.onended=()=>{document.body.classList.remove('audio-active');const b=$('#pause-brief');if(b)b.textContent='↺ Replay outlet defence'};audio.onpause=()=>{if(audio.currentSrc){document.body.classList.remove('audio-active');const b=$('#pause-brief');if(b)b.textContent='▶ Resume voice'}};stepper(0);welcome();
</script></body></html>
